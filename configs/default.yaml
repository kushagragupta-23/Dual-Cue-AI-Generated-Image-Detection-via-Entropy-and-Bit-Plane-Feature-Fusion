# Default Configuration for MLEP AI-Generated Image Detection Pipeline

dataset:
  data_dir: "dataset10000"
  image_size: 256
  batch_size: 32
  num_workers: 0  # Windows-safe (set to 2 on Linux/macOS)
  val_split: 0.15
  test_split: 0.15
  seed: 42
  enable_augmentations: false
  jpeg_quality_min: 70
  jpeg_quality_max: 100
  blur_sigma_min: 0.5
  blur_sigma_max: 2.0

mlep:
  patch_size: 2
  scales: [1.0, 0.5, 0.25]
  window_size: 2
  seed: 42
  use_shuffling: false  # Disabled: pretrained ResNet expects spatial coherence

training:
  epochs: 10
  lr: 0.0002
  weight_decay: 0.01
  early_stopping_patience: 5
  gradient_clip_norm: 1.0
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  scheduler_eta_min: 0.000001
  differential_lr:
    backbone: 0.5   # Multiplier for pretrained backbone LR
    head: 5.0        # Multiplier for classifier head LR
    extractor: 1.0   # Multiplier for MLEP extractor LR

hardware:
  device: "cuda"       # "cuda" or "cpu"
  amp: true            # Automatic Mixed Precision (CUDA only)
  cudnn_benchmark: true
  tf32: true           # TF32 Tensor Core acceleration (RTX 30/40 series)
  target_gpu: "NVIDIA RTX 4050"

logging:
  log_dir: "logs"
  level: "INFO"
  save_file: true
