# Default Configuration for MLEP Preprocessing and Dataset Pipeline

dataset:
  data_dir: "dataset10000"
  image_size: 256
  batch_size: 32
  num_workers: 4
  val_split: 0.15
  test_split: 0.15
  seed: 42
  enable_augmentations: false
  jpeg_quality_min: 70
  jpeg_quality_max: 100
  blur_sigma_min: 0.5
  blur_sigma_max: 2.0

mlep:
  patch_size: 2
  scales: [1.0, 0.5, 0.25]
  window_size: 2
  seed: 42

logging:
  log_dir: "logs"
  level: "INFO"
  save_file: true
